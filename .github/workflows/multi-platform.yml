name: Multi-platform build

# Builds GucciBot for every platform Geode runs on and packages one .geode
# with all five binaries and every resource, the renderer's FFmpeg DLLs
# and macOS dylibs included. This package is THE build: a release ships it as it is, Nigel's
# game runs it (install_ci_build.bat), and dihmaster's copy is it - one
# universal file per commit (Nigel, 2026-10-12). Since 2.0.0-beta.3 mod.json
# declares every platform itself (the combine step keeps one job's mod.json, so
# a platform added per job went missing from the package); the step below only
# matters if one is ever taken out again.

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Windows, os: windows-latest, target: Win64, gd: win }
          - { name: macOS, os: macos-latest, target: MacOS, gd: mac }
          - { name: iOS, os: macos-latest, target: iOS, gd: ios }
          - { name: Android64, os: ubuntu-latest, target: Android64, gd: android }
          - { name: Android32, os: ubuntu-latest, target: Android32, gd: android }

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      # The renderer's seven FFmpeg DLLs. Two are over GitHub's 100 MB file limit
      # (.gitignore), so all seven live as a release asset in
      # github.com/Nigelx1/guccibot-build-files and are packed in here, checked
      # against this SHA-256 first. Every job takes them: the combine step keeps
      # one job's resources.
      - name: Fetch the renderer's FFmpeg DLLs
        shell: bash
        run: |
          curl -fsSL --retry 3 -o ffmpeg-libs.zip             https://github.com/Nigelx1/guccibot-build-files/releases/download/ffmpeg-n8.0.1/ffmpeg-libs.zip
          PY=$(command -v python || command -v python3)
          "$PY" - <<'PYEOF'
          import hashlib, sys, zipfile
          want = "94c570044c0956ce988b0b4e19b5aa046643bb7d254e429e31907f706b7d76b2"
          got = hashlib.sha256(open("ffmpeg-libs.zip", "rb").read()).hexdigest()
          if got != want:
              sys.exit(f"ffmpeg-libs.zip is {got}, not {want} - refusing to build")
          zipfile.ZipFile("ffmpeg-libs.zip").extractall("resources/ffmpeg_libs")
          PYEOF
          rm ffmpeg-libs.zip
          ls -l resources/ffmpeg_libs

      # The same seven FFmpeg libraries for macOS: universal dylibs (arm64 +
      # x86_64, install names @loader_path/<name>, ad-hoc signed) from the
      # ffmpeg-n8.0.1-mac release of guccibot-build-files, checked against this
      # SHA-256 first and unpacked next to the DLLs. Every job takes them too,
      # for the same reason: the combine step keeps one job's resources.
      - name: Fetch the renderer's FFmpeg dylibs (macOS)
        shell: bash
        run: |
          curl -fsSL --retry 3 -o ffmpeg-libs-mac.zip         https://github.com/Nigelx1/guccibot-build-files/releases/download/ffmpeg-n8.0.1-mac/ffmpeg-libs-mac.zip
          PY=$(command -v python || command -v python3)
          "$PY" - <<'PYEOF'
          import hashlib, os, sys, zipfile
          want = "e4caf02bf083f4368f97d9be5f116df71c698d1d0c92e95d13689c5eabbbd3dc"
          got = hashlib.sha256(open("ffmpeg-libs-mac.zip", "rb").read()).hexdigest()
          if got != want:
              sys.exit(f"ffmpeg-libs-mac.zip is {got}, not {want} - refusing to build")
          names = ["libavutil.60.dylib", "libswresample.6.dylib", "libswscale.9.dylib", "libavcodec.62.dylib",
                   "libavformat.62.dylib", "libavfilter.11.dylib", "libavdevice.62.dylib"]
          os.makedirs("resources/ffmpeg_libs", exist_ok=True)
          z = zipfile.ZipFile("ffmpeg-libs-mac.zip")
          found = {}
          for info in z.infolist():
              base = os.path.basename(info.filename)
              if base in names and not info.is_dir():
                  found[base] = info
          missing = [n for n in names if n not in found]
          if missing:
              sys.exit(f"ffmpeg-libs-mac.zip has no {', '.join(missing)} - refusing to build")
          for base, info in found.items():
              with z.open(info) as src, open(os.path.join("resources/ffmpeg_libs", base), "wb") as dst:
                  dst.write(src.read())
          PYEOF
          rm ffmpeg-libs-mac.zip
          ls -l resources/ffmpeg_libs

      - name: Declare ${{ matrix.config.gd }} in mod.json
        shell: bash
        run: >
          node -e "const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('mod.json', 'utf8'));
          m.gd['${{ matrix.config.gd }}'] = m.gd.win;
          fs.writeFileSync('mod.json', JSON.stringify(m, null, 4));"

      # GitHub's windows-latest image (windows-2025-vs2026) is moving from MSVC
      # 14.51 to 14.52 (image 20261116.315 and later) and keeps LLVM 20.1.8,
      # and 14.52's C++ library refuses Clang before 22 ("error STL1000:
      # Unexpected compiler version, expected Clang 22 or newer"): the
      # "Could NOT find Boost" failures of 2026-11-18. Both image versions also
      # have the VS 2022 toolset, MSVC 14.44, which takes Clang 19 and up and is
      # the one local Windows builds use. Clang is pointed at it on every image
      # (VCToolsInstallDir), so a job builds with the same compiler and library
      # whichever image it gets. The job stops here if 14.44 is gone.
      - name: Use the MSVC 14.44 toolset
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VS="/c/Program Files/Microsoft Visual Studio"
          d=$(ls -d "$VS"/*/*/VC/Tools/MSVC/14.44.* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$d" ]; then
            echo "No MSVC 14.44 toolset on this image. The toolsets here:"
            ls -d "$VS"/*/*/VC/Tools/MSVC/* 2>/dev/null
            exit 1
          fi
          w="$(cygpath -w "$d")\\"
          echo "VCToolsInstallDir=$w" >> "$GITHUB_ENV"
          echo "MSVC toolset for Clang: $w"
          printf '#include <filesystem>\nint main() { return std::filesystem::path("a").empty() ? 1 : 0; }\n' > msvc-check.cpp
          VCToolsInstallDir="$w" clang++ -std=c++17 -v -c msvc-check.cpp -o msvc-check.obj 2>&1 | grep -i "MSVC" | head -n 4
          VCToolsInstallDir="$w" clang++ -std=c++17 -c msvc-check.cpp -o msvc-check.obj
          rm -f msvc-check.cpp msvc-check.obj

      # Pinned to the commit main pointed at on 2026-11-17 (the one CI already
      # ran), so an upstream change can't alter the release build.
      - uses: geode-sdk/build-geode-mod@61a56c697aea9655e3f31c6c1b83870431f30434
        with:
          combine: true
          target: ${{ matrix.config.target }}
          # The bindings the local Windows build uses (build/_deps/bindings-src).
          bindings-ref: d641858f3e1cd2c6d86013c799f224ebdb8ec1cd

      # Only on a failed build. The Windows jobs sometimes stop in the
      # bindings' codegen configure at "Could NOT find Boost": PEGTL's
      # std::filesystem test compiles failed, and why is only in CMake's
      # configure log, so this prints those compiles' output. rerun-flaky.yml
      # reruns such a run.
      - name: Show the codegen configure's failed test compiles
        if: failure()
        shell: bash
        run: |
          f=build/bindings/codegen-build/CMakeFiles/CMakeConfigureLog.yaml
          if [ -f "$f" ]; then
            echo "Failed test compiles in $f (each one's build output, then its exit code):"
            grep -n -B40 'exitCode: [1-9]' "$f" | tail -n 300
          else
            echo "No $f: the build stopped before the codegen configure, or got past it."
          fi

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      # Pinned to the commit main pointed at on 2026-11-17 (the one CI already
      # ran), so an upstream change can't alter the release build.
      - uses: geode-sdk/build-geode-mod/combine@61a56c697aea9655e3f31c6c1b83870431f30434
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: GucciBot (all platforms)
          path: ${{ steps.build.outputs.build-output }}
