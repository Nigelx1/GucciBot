name: Rerun a build that hit a known CI flake

# Two failures in the build workflows aren't the code's fault, and a rerun of
# the failed jobs passes:
# - Windows: the bindings' codegen configure stops at "Could NOT find Boost
#   (missing: Boost_INCLUDE_DIR filesystem)". PEGTL's std::filesystem test
#   compiles fail, so it looks for Boost, which isn't there. First seen
#   2026-11-18, when it hit five runs; the build workflows now print the test
#   compile's own error when a build fails, to find out why.
# - macOS and iOS: "The job was not acquired by Runner of type hosted even after
#   multiple attempts" (GitHub had no Mac runner free). Eight runs from
#   2026-10-21 to 2026-11-18.
# This reruns a failed build's failed jobs, at most twice, and only when every
# failed or cancelled job is one of those two. Any other failure stays red for
# someone to read. It never changes what a build makes.

on:
  workflow_run:
    workflows: ["Multi-platform build", "GD 2.2091 build (Geode 6, Windows preview)"]
    types: [completed]
    branches: [master]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Rerun the failed jobs if they all hit a known flake
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -u
          BOOST='Could NOT find Boost (missing: Boost_INCLUDE_DIR filesystem)'
          NORUNNER='was not acquired by Runner'
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "\(.id)\t\(.conclusion)\t\(.name)"' < /dev/null)
          if [ -z "$jobs" ]; then
            echo "No failed or cancelled jobs in attempt $ATTEMPT; nothing to do."
            exit 0
          fi
          flaky=1
          while IFS=$'\t' read -r id conclusion name; do
            # curl, not gh api: gh refuses a response with terminal escape sequences, and job logs have color codes
            if [ "$conclusion" = failure ] && curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" < /dev/null 2>/dev/null | grep -qF "$BOOST"; then
              echo "$name: failed on the Boost flake (bindings codegen configure)"
            elif [ "$conclusion" = cancelled ] && gh api "repos/$REPO/check-runs/$id/annotations" --jq '.[].message' < /dev/null 2>/dev/null | grep -qF "$NORUNNER"; then
              echo "$name: GitHub found no runner for it"
            else
              echo "$name: $conclusion for another reason"
              flaky=0
            fi
          done <<< "$jobs"
          if [ "$flaky" != 1 ]; then
            echo "Not every failure is a known flake: the run is left as it is."
            exit 0
          fi
          gh run rerun "$RUN" --repo "$REPO" --failed < /dev/null
          echo "Reran the failed jobs of run $RUN (attempt $ATTEMPT was all known flakes)."
